<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toulmin Phase 0 Compatibility Spike Harness (Non-Production)</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 1100px;
        margin: 1.5rem auto;
        padding: 0 1rem 3rem;
        line-height: 1.45;
        color: #16181d;
      }
      h1, h2 {
        margin-top: 1.25rem;
      }
      .spike-panel {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
        background: #f8fafc;
      }
      .spike-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.75rem 0;
      }
      button {
        padding: 0.45rem 0.85rem;
        border-radius: 6px;
        border: 1px solid #94a3b8;
        background: #ffffff;
        cursor: pointer;
        font-size: 0.9rem;
      }
      button:hover {
        background: #e2e8f0;
      }
      .spike-field-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 0.65rem;
      }
      label {
        display: flex;
        flex-direction: column;
        font-size: 0.85rem;
        gap: 0.25rem;
      }
      input, select {
        padding: 0.35rem 0.5rem;
        border: 1px solid #94a3b8;
        border-radius: 4px;
      }
      pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 0.85rem;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 0.82rem;
      }
      .spike-result-card {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 0.75rem;
        margin-bottom: 0.65rem;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <main id="spike-root"></main>
    <script type="module" src="/src/spike-main.ts"></script>
  </body>
</html>
