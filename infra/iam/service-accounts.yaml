# Per-class service accounts, least-privilege IAM bindings, secret accessors,
# and Firestore TTL policies per docs/spec/05_BACKEND_SECURITY_AND_FINOPS.md (§1.3, §3.0, §6.3).
project: toulmin-prod
region: us-central1
storageBucket: toulmin-prod.firebasestorage.app
serverlessVpcAccessConnector: null

serviceAccounts:
  bib-sa:
    email: bib-sa@toulmin-prod.iam.gserviceaccount.com
    functions:
      - bibResolve
      - bibResolveJudge
    roles:
      - roles/datastore.user
    secrets:
      - OPENALEX_API_KEY
      - S2_API_KEY
      - CROSSREF_MAILTO
      - NET_HASH_PEPPER
    firestore:
      readWrite:
        - /refmeta/*
        - /users/*/quota/*
        - /netCounters/*
        - /global/counters/shards/*
      read:
        - /global/state
        - /judgeCodes/*
    storage: []

  oafetch-sa:
    email: oafetch-sa@toulmin-prod.iam.gserviceaccount.com
    functions:
      - oaFetch
      - oaFetchJudge
    roles:
      - roles/datastore.user
      - roles/storage.objectUser
      - roles/run.invoker
    invokerTargets:
      - oaParse
      - oaParseJudge
    secrets:
      - UNPAYWALL_EMAIL
      - NET_HASH_PEPPER
    firestore:
      readWrite:
        - /refmeta/*
        - /global/arxivLock
        - /users/*/quota/*
        - /netCounters/*
        - /global/counters/shards/*
      read:
        - /global/state
        - /judgeCodes/*
    storage:
      readWrite:
        - /oa/**

  oaparse-sa:
    email: oaparse-sa@toulmin-prod.iam.gserviceaccount.com
    functions:
      - oaParse
      - oaParseJudge
    roles: []
    secrets: []
    firestore:
      readWrite: []
      read: []
    storage:
      readWrite: []
    invokers:
      - oafetch-sa@toulmin-prod.iam.gserviceaccount.com

  quota-sa:
    email: quota-sa@toulmin-prod.iam.gserviceaccount.com
    functions:
      - quotaGuard
    roles:
      - roles/firebaseappcheck.tokenVerifier
      - roles/datastore.user
    secrets:
      - NET_HASH_PEPPER
    firestore:
      readWrite:
        - /users/*/quota/*
        - /users/*/leases/*
        - /netCounters/*
        - /global/counters/shards/*
      read:
        - /global/state
        - /judgeCodes/*
    storage: []

  judge-sa:
    email: judge-sa@toulmin-prod.iam.gserviceaccount.com
    functions:
      - redeemJudgeCode
    roles:
      - roles/firebaseauth.admin
      - roles/firebaseappcheck.tokenVerifier
      - roles/datastore.user
    secrets:
      - JUDGE_CODE_PEPPER
      - NET_HASH_PEPPER
    params:
      - JUDGE_TIER_EXPIRY_EPOCH
    firestore:
      readWrite:
        - /judgeCodes/*
        - /users/*/quota/*
        - /netCounters/*
      read:
        - /global/state
    storage: []

  ops-sa:
    email: ops-sa@toulmin-prod.iam.gserviceaccount.com
    functions:
      - budgetBreaker
      - recaptchaBreaker
      - rwSnapshot
    roles:
      - roles/firebaseremoteconfig.admin
      - roles/datastore.user
      - roles/storage.objectAdmin
      - roles/recaptchaenterprise.admin
    secrets: []
    firestore:
      readWrite:
        - /global/state
      read: []
    storage:
      readWrite:
        - /rw/**

secrets:
  OPENALEX_API_KEY:
    - bib-sa
  S2_API_KEY:
    - bib-sa
  CROSSREF_MAILTO:
    - bib-sa
  UNPAYWALL_EMAIL:
    - oafetch-sa
  NET_HASH_PEPPER:
    - bib-sa
    - oafetch-sa
    - quota-sa
    - judge-sa
  JUDGE_CODE_PEPPER:
    - judge-sa

functions:
  bibResolve:
    trigger: callable
    appCheck: standard
    maxInstances: 1
    concurrency: 20
    memory: 512MiB
    cpu: 1
    timeoutSeconds: 120
    serviceAccount: bib-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false
  bibResolveJudge:
    trigger: callable
    appCheck: standard
    maxInstances: 1
    concurrency: 20
    memory: 512MiB
    cpu: 1
    timeoutSeconds: 120
    serviceAccount: bib-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false
  oaFetch:
    trigger: callable
    appCheck: standard
    maxInstances: 3
    concurrency: 4
    memory: 512MiB
    cpu: 1
    timeoutSeconds: 60
    serviceAccount: oafetch-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false
  oaFetchJudge:
    trigger: callable
    appCheck: standard
    maxInstances: 2
    concurrency: 4
    memory: 512MiB
    cpu: 1
    timeoutSeconds: 60
    serviceAccount: oafetch-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false
  oaParse:
    trigger: http-iam-private
    appCheck: none
    maxInstances: 10
    concurrency: 1
    memory: 2GiB
    cpu: 1
    timeoutSeconds: 60
    serviceAccount: oaparse-sa@toulmin-prod.iam.gserviceaccount.com
    invoker:
      - oafetch-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false
  oaParseJudge:
    trigger: http-iam-private
    appCheck: none
    maxInstances: 4
    concurrency: 1
    memory: 2GiB
    cpu: 1
    timeoutSeconds: 60
    serviceAccount: oaparse-sa@toulmin-prod.iam.gserviceaccount.com
    invoker:
      - oafetch-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false
  quotaGuard:
    trigger: callable
    appCheck: consuming
    maxInstances: 3
    concurrency: 40
    memory: 256MiB
    cpu: 1
    timeoutSeconds: 30
    serviceAccount: quota-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false
  redeemJudgeCode:
    trigger: callable
    appCheck: consuming
    maxInstances: 3
    concurrency: 10
    memory: 256MiB
    cpu: 1
    timeoutSeconds: 30
    serviceAccount: judge-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false
  budgetBreaker:
    trigger: pubsub:billing-alerts
    appCheck: none
    maxInstances: 1
    concurrency: 1
    memory: 512MiB
    cpu: 1
    timeoutSeconds: 300
    serviceAccount: ops-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false
  recaptchaBreaker:
    trigger: pubsub:recaptcha-alerts
    appCheck: none
    maxInstances: 1
    concurrency: 1
    memory: 512MiB
    cpu: 1
    timeoutSeconds: 300
    serviceAccount: ops-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false
  rwSnapshot:
    trigger: schedule
    appCheck: none
    maxInstances: 1
    concurrency: 1
    memory: 512MiB
    cpu: 1
    timeoutSeconds: 300
    serviceAccount: ops-sa@toulmin-prod.iam.gserviceaccount.com
    publicHttp: false

firestoreTtlPolicies:
  leases:
    collectionGroup: leases
    path: /users/{uid}/leases
    ttlField: expireAt
    retentionHours: 24
  quota:
    collectionGroup: quota
    path: /users/{uid}/quota
    ttlField: expireAt
    retentionDays: 3
  netCounters:
    collectionGroup: netCounters
    path: /netCounters
    ttlField: expireAt
    retentionDays: 3
  refmeta:
    collectionGroup: refmeta
    path: /refmeta
    ttlField: expireAt
    retentionDays: 30
  shards:
    collectionGroup: shards
    path: /global/counters/shards
    ttlField: expireAt
    retentionDays: 30
